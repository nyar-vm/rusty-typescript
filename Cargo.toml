[workspace]
resolver = "3"
members = [
    "compilers/*",
    "examples/basic_types"
]
default-members = [
    "compilers/*",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
authors = ["Rusty TypeScript Team"]
description = "Rusty TypeScript - A high-performance TypeScript compiler written in Rust"
license = "MIT"
repository = "https://github.com/rusty-typescript/rusty-typescript.git"
homepage = "https://github.com/rusty-typescript/rusty-typescript.git"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = { version = "0.10.0", default-features = false, features = ["std_rng", "thread_rng"] }
futures = "0.3.32"
tokio = { version = "1.50.0", features = ["full"] }

proc-macro2 = "1.0.106"
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.45"
clap = { version = "4.6.0", features = ["derive"] }
num_cpus = "1.17.0"
sha2 = "0.11.0"
pathdiff = "0.2.3"
rayon = "1.11.0"
toml = "1.1.0"
walkdir = "2.5.0"
libc = "0.2.183"
winapi = { version = "0.3.9", features = ["winbase", "winnt", "fileapi", "handleapi", "processenv"] }
once_cell = "1.21.4"
regex = "1.12.3"
base64 = "0.22.1"
hex = "0.4.0"

typescript = { path = "compilers/typescript", version = "0.0.4" }
typescript-types = { path = "compilers/typescript-types", version = "0.0.4" }
typescript-ir = { path = "compilers/typescript-ir", version = "0.0.4" }
typescript-webidl = { path = "compilers/typescript-webidl", version = "0.0.4" }

oak-core = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.11" }
oak-lsp = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.11" }
oak-mcp = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.11" }
oak-vfs = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.11" }
oak-idl = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.11" }
oak-typescript = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev", version = "0.0.11" }
