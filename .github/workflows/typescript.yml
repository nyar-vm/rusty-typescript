name: TypeScript CI

on:
    push:
        branches: [master, dev]
    pull_request:
        branches: [master, dev]

jobs:
    typescript-build:
        name: TypeScript Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.18.3

            - name: Install dependencies
              run: pnpm install
              working-directory: .

            - name: Build TypeScript WASI package
              run: pnpm -F @nyar/typescript build
              working-directory: .

            - name: Build TypeScript homepage
              run: pnpm -F @nyar/typescript-homepage build
              working-directory: .